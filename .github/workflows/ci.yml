name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # The whole workspace (including pjsip-shim) must build with default
      # features and no external pjproject checkout. This guards against a
      # regression like the hardcoded /tmp/pjproject path (issue #5).
      - name: Build
        run: cargo build --workspace
      # pjsip-shim's unit tests and lints exercise the optional pjproject C
      # layer, which needs the pjproject-cffi feature + source tree (covered
      # by the pjsip-shim-cffi job). Exclude it from the pure-Rust gates.
      - name: Test
        run: cargo test --workspace --exclude pjsip-shim
      - name: Clippy
        run: cargo clippy --workspace --exclude pjsip-shim -- -D warnings
      # The native codec system libraries are not installed on the runner;
      # `cargo check` still runs build.rs (link-directive emission) and
      # compiles the feature-gated FFI code without the final link step, so
      # a compile regression behind these features is caught (issue #15).
      - name: Check native codec features
        run: cargo check -p asterisk-codecs --features native-opus,native-gsm,native-speex
      # The fuzz crate is its own workspace and drives the REAL production
      # parsers via path deps. `cargo fuzz build` needs nightly + libFuzzer,
      # but a plain `cargo check` on the pinned stable toolchain still type-
      # checks every harness against the current parser signatures. This is
      # the guard that keeps the targets wired to production code instead of
      # silently drifting back into standalone copies (the gap that hid the
      # #108/#109 remote-crash panics from fuzzing).
      - name: Check fuzz targets compile against real parsers
        run: cargo check --manifest-path fuzz/Cargo.toml

  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --workspace

  pjsip-shim-cffi:
    # Builds the optional pjproject C compatibility layer so a future
    # missing-source / hardcoded-path / duplicate-symbol regression in the
    # shim's build.rs is caught rather than masked (issue #5).
    #
    # This is build-only: the shim's own unit tests were written against the
    # pure-Rust stubs and pass null pools/atomics that the real pjproject C
    # asserts on (SIGABRT). Running them against the C layer needs the tests
    # adapted first; that is tracked separately.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pjproject 2.16
        run: scripts/fetch-pjproject.sh
      - name: Build shim with pjproject-cffi
        run: cargo build -p pjsip-shim --features pjproject-cffi

  e2e-trunk:
    # Hermetic end-to-end proof of the inbound-trunk PIN-gate path
    # (synthetic Chime INVITE -> PinGate -> GRANTED -> Dial(PJSIP/qa-bridge)
    # -> a mock registered SIP endpoint -> two-way RTP; and wrong PIN ->
    # REJECTED -> no Dial). It is fully self-contained: only the rustisk
    # binary + python3 stdlib + loopback (no FreeSWITCH, Mumble, docker,
    # NET_RAW or root), so it runs unattended here. See tests/e2e-trunk/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Build rustisk binary
        run: cargo build --bin rustisk
      - name: Run hermetic trunk e2e (PIN gate -> bridge -> two-way RTP + reject)
        run: tests/e2e-trunk/run.sh
