[package]
name = "asterisk-codecs"
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
# Enable native Opus codec via FFI to libopus.
# When disabled, Opus encode/decode returns a stub error.
# Links the system libopus (build.rs: OPUS_LIB_DIR > pkg-config > -lopus).
native-opus = []
# Enable native GSM codec via FFI to libgsm.
# Links the system libgsm (build.rs: GSM_LIB_DIR > pkg-config > -lgsm).
native-gsm = []
# Enable native Speex codec via FFI to libspeex.
# Links the system libspeex (build.rs: SPEEX_LIB_DIR > pkg-config > -lspeex).
native-speex = []

[dependencies]
asterisk-types = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
once_cell = "1"
