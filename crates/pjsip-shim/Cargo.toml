[package]
license = "GPL-2.0-only"
name = "pjsip-shim"
version = "0.1.0"
edition = "2021"

[lib]
name = "pjsip_rs"
crate-type = ["cdylib", "staticlib"]

[features]
# Off by default: the crate builds as a pure-Rust cdylib/staticlib with no
# external dependency. Enable `pjproject-cffi` to compile pjproject 2.16's
# real ioqueue/threading/locking C sources into the shim (needs the
# pjproject source tree; see scripts/fetch-pjproject.sh or set PJPROJECT_DIR).
default = []
pjproject-cffi = []

[dependencies]
asterisk-sip = { path = "../asterisk-sip" }
asterisk-types = { path = "../asterisk-types" }
asterisk-codecs = { path = "../asterisk-codecs" }
parking_lot = { workspace = true }
libc = "0.2"

[build-dependencies]
cc = "1"
