[pin-gate]
exten => 9000,1,Answer()
 same => n,Read(PIN,@PROMPT_DIR@/pin-prompt.wav,6,,1,5,2)
 same => n,GotoIf($["${PIN}" = "123456"]?10:20)
 same => 10,Verbose(0,PIN_GATE_RESULT=GRANTED)
 same => n,Playback(@PROMPT_DIR@/granted.wav)
 same => n,Hangup()
 same => 20,Verbose(0,PIN_GATE_RESULT=REJECTED)
 same => n,Playback(@PROMPT_DIR@/rejected.wav)
 same => n,Hangup()

exten => 9001,1,Answer()
 same => n,Dial(PJSIP/9199@@FS_CONTAINER_IP@:5060,1)
 same => n,Hangup()

[outbound-proof]
exten => 9100,1,Wait(1)
 same => n,Playback(@PROMPT_DIR@/outbound-tone.wav)
 same => n,Wait(0.25)
 same => n,Hangup()
