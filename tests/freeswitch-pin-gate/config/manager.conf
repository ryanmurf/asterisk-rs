[general]
enabled = yes
bindaddr = 127.0.0.1
port = 15038

[harness]
secret = pin-gate-local-only
; Explicit least-privilege grant (AMI default is now DENY, issues #126/#127).
; This single account is the M3 zero-hit audit subscriber AND the harness driver:
;   read = all    -> the subscriber must observe every event category so the
;                    zero-hit PIN audit is a real search, and the positive
;                    control (Newexten/PinGate + VarSet/PINGATESTATUS) proves it
;                    is live and receiving. Without an explicit read= the
;                    subscriber would see NOTHING and the audit would falsely pass.
;   write = system -> the only AMI action the harness DRIVES is Originate, which
;                    requires the SYSTEM write category. Scoping to `system` (not
;                    `all`) means a regression that broke the Originate->SYSTEM
;                    mapping would make the harness's AMI Originate fail, so the
;                    live harness is a real guard for the write gate rather than
;                    masking it. Read-only actions (CoreStatus/CoreShowChannels/
;                    RTPStats) are ungated regardless.
read = all
write = system
