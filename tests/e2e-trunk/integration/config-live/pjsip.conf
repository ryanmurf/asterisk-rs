; ============================================================================
; rustisk M9 trunk config — pjsip.conf  (LIVE — copy over pjsip.conf at cutover)
; Values already substituted from the dry-run rendering. Confirm the two <REAL>
; items before use. voice.murphytek.com resolved to 66.7.119.163 at arming time
; (2026-07-18) — re-verify at cutover: getent hosts voice.murphytek.com
; ============================================================================

[transport-udp]
type = transport
protocol = udp
bind = 192.168.0.109:45070
external_signaling_address = 66.7.119.163
external_media_address = 66.7.119.163
local_net = 192.168.0.0/16
local_net = 10.0.0.0/8

[chime-trunk]
type = endpoint
context = pin-gate
disallow = all
allow = ulaw
direct_media = no
rtp_symmetric = yes
dtmf_mode = rfc4733

[chime-trunk-identify]
type = identify
endpoint = chime-trunk
match = 99.77.253.0/24

[qa-bridge]
type = endpoint
context = pin-gate
disallow = all
allow = ulaw
direct_media = no
rtp_symmetric = yes
dtmf_mode = rfc4733
auth = qa-bridge-auth

[qa-bridge-auth]
type = auth
auth_type = userpass
username = qa-bridge
password = <QA_BRIDGE_AUTH_PASSWORD__INJECT_AT_RUNTIME>

[qa-bridge-identify]
type = identify
endpoint = qa-bridge
match = 192.168.0.109/32
