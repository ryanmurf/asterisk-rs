[general]
; Point at a mounted file containing the REAL 6 ASCII digits (no trailing junk;
; a trailing newline is tolerated). Reuse the SAME secret the live FS uses:
;   the FS trunk reads /etc/voice-sip/inbound-pin (k8s secret voice-sip/inbound-pin).
; Stage that value into a host-local file for rustisk, e.g.:
;   microk8s kubectl get secret voice-sip -n voice -o jsonpath='{.data.inbound-pin}' \
;     | base64 -d > /mnt/data/herodevs-agents/m9-arm/secret/pin.live   (chmod 600)
secret_file = /mnt/data/herodevs-agents/m9-arm/secret/pin.live
