; Minimal dialplan (AMI Originate requires one). The outbound INVITE to the
; carrier is the Originate's Channel (PJSIP/carrier). Wait() holds the channel
; alive through the 401 -> credentialed-retry -> 200 exchange so the dialog is
; established; Hangup() then drives the in-dialog BYE to the route-set target,
; giving the harness a receiver-side BYE to assert on.
[default]
exten => s,1,Wait(2)
 same => n,Hangup()
